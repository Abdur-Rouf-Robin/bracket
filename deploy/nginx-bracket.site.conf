# Public front for Bracket — same pattern as vms.arrobin.com / anime.arrobin.com.
# Internet → nginx :80/:443 → 127.0.0.1:3200 (Next) + 127.0.0.1:4200 (Nest)
# Bracket ports stay 3200 / 4200 / 5433. Do not reuse VMS 3000 / 4000 / 5432
# or Anemi 3100 / 4100 / 5434.
#
# Next pages overlap Nest JSON routes (/t/:slug, /tournaments/...), so the API
# is exposed at https://bracket.arrobin.com/backend/... (prefix stripped).

upstream bracket_frontend {
    server 127.0.0.1:3200;
    keepalive 32;
}

upstream bracket_backend {
    server 127.0.0.1:4200;
}

server {
    listen 80;
    listen [::]:80;
    server_name bracket.arrobin.com;

    server_tokens off;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/wasm text/xml application/xml image/svg+xml;

    location /socket.io/ {
        proxy_pass http://bracket_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location /backend/ {
        proxy_pass http://bracket_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    location /_next/static/ {
        proxy_pass http://bracket_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://bracket_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, must-revalidate" always;
    }
}
