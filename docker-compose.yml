# Optional local/dev only. Production uses a native Postgres cluster:
#   18/bracket on 127.0.0.1:5433  (NOT VMS 5432, NOT Anemi 5434)
# Do not `docker compose up` on this server in production — it would fight
# the native cluster on 5433.
services:
  postgres:
    profiles: ["dev"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bracket
      POSTGRES_PASSWORD: bracket
      POSTGRES_DB: bracket
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - bracket_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bracket -d bracket"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    profiles: ["dev"]
    image: redis:7-alpine
    restart: unless-stopped
    # Host 6380 avoids clashing with VMS Redis 6379 and Anemi 6381
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - bracket_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bracket_pg:
  bracket_redis:
